name: Daily AI Blog Generation

on:
  schedule:
    - cron: '0 0,8,16 * * *' # Every 8 hours (Midnight, 8 AM, 4 PM UTC)
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Blog Post
        run: node scripts/generate_blog.js
        env:
          GROQ_API_KEY: ${{ secrets.BLOGGROK }}

      - name: Notify Google Indexing API
        run: |
          npm install googleapis
          node scripts/index_now.js
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT }}

      - name: Commit and Push
        run: |
          git config --global user.name "AI Blog Bot"
          git config --global user.email "bot@omarcreatives.com"
          git add src/content/blog/*.md src/assets/blog-*.jpg
          git commit -m "chore: auto-generate blog post with image" || echo "No changes to commit"
          git push origin main
